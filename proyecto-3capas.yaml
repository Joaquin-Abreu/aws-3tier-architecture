AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Arquitectura de 3 capas: VPC con subnet publica (EC2) y dos subnets
  privadas en distintas AZ (RDS), replicando la infraestructura armada
  manualmente en la consola de AWS.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Nombre del key pair existente para SSH a la EC2

  MyIP:
    Type: String
    Description: Tu IP publica en formato CIDR (ej. 190.190.190.190/32), para SSH
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'

  DBUsername:
    Type: String
    Default: admin
    Description: Usuario master de la base de datos

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password master de la base de datos (minimo 8 caracteres)

  DBName:
    Type: String
    Default: proyectodb
    Description: Nombre de la base de datos inicial

Resources:

  # ---------- Red: VPC, subnets, internet gateway, ruteo ----------

  ProyectoVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: proyecto-vpc

  SubnetPublica:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProyectoVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: subnet-publica

  SubnetPrivada:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProyectoVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: subnet-privada

  SubnetPrivada2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProyectoVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: subnet-privada-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: proyecto-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ProyectoVPC
      InternetGatewayId: !Ref InternetGateway

  RouteTablePublica:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProyectoVPC
      Tags:
        - Key: Name
          Value: routeproyecto

  RutaInternet:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTablePublica
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AsociacionSubnetPublica:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPublica
      RouteTableId: !Ref RouteTablePublica

  # ---------- Security Groups ----------

  SGEc2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group para la instancia EC2
      VpcId: !Ref ProyectoVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP desde cualquier lugar
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
          Description: SSH solo desde mi IP
      Tags:
        - Key: Name
          Value: sg-ec2

  SGRds:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group para RDS, solo acepta trafico desde sg-ec2
      VpcId: !Ref ProyectoVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref SGEc2
          Description: MySQL solo desde la EC2
      Tags:
        - Key: Name
          Value: sg-rds

  # ---------- EC2 ----------

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetPublica
      SecurityGroupIds:
        - !Ref SGEc2
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Funciona</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: ec2-proyecto

  # ---------- RDS ----------

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets privadas para RDS
      SubnetIds:
        - !Ref SubnetPrivada
        - !Ref SubnetPrivada2
      Tags:
        - Key: Name
          Value: proyecto-db-subnet-group

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: proyecto-db
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref SGRds
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
    DeletionPolicy: Delete

Outputs:
  EC2PublicIP:
    Description: IP publica de la instancia EC2
    Value: !GetAtt EC2Instance.PublicIp

  RDSEndpoint:
    Description: Endpoint de la base de datos RDS
    Value: !GetAtt RDSInstance.Endpoint.Address

  VPCId:
    Description: ID de la VPC creada
    Value: !Ref ProyectoVPC
